    <script>
        // Função auxiliar para prompt da nota no exercício 07
        function promptNota() {
            let nota = prompt("Digite a nota (0 a 10):");
            nota = parseFloat(nota);
            if (isNaN(nota) || nota < 0 || nota > 10) {
                alert("Por favor, digite uma nota válida entre 0 e 10.");
                return null;
            }
            return nota;
        }
    </script>
